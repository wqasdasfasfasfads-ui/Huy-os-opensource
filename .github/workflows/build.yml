name: build
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y nasm gcc binutils python3 qemu-utils
      - name: Build
        run: ./build.sh
      - name: Upload images
        uses: actions/upload-artifact@v4
        with:
          name: huyos-images
          path: |
            build/huyos.iso
            build/huyos.img
            build/huyos.vdi
            build/huyos.vmdk
